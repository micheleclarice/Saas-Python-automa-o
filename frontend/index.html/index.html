<!DOCTYPE html>
<html>

<head>
    <title>SaaS AI Sales</title>
</head>

<body>
    <h1>AI Sales Agent</h1>

    <input id="msg" placeholder="Fale com o vendedor" />
    <button onclick="send()">Enviar</button>

    <pre id="out"></pre>

    <script>
        async function send() {
            const msg = document.getElementById("msg").value;

            const res = await fetch("https://YOUR-BACKEND/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_id: "demo",
                    message: msg
                })
            });

            const data = await res.json();
            document.getElementById("out").innerText = data.reply;
        }
    </script>

</body>

</html>
